# Swing dataset labels. Each entry describes the intent of one swing
# clip so the validation script can check feature outputs against
# expected patterns.
#
# All fault_demo entries isolate a single CAUSE — a specific
# mechanical pattern in the swing. Symptoms (slice, hook, pull, push,
# fat, thin) are not directly demonstrated; they emerge from the
# combination of causes plus face-to-path geometry. Validating that
# features detect causes in isolation is sufficient to validate that
# the system can identify those causes when they appear in
# combination in real swings.
#
# Schema:
#   type: "normal" | "fault_demo"
#   intended_fault: short_snake_case_name  (fault_demo only)
#   deferred: true                         (fault_demo only, optional)
#     Skip validation entirely. Used for demos whose expected
#     features depend on capabilities not built in v1 (e.g., ball
#     detection).
#   expected_features:                     (fault_demo only)
#     <feature_name>:
#       direction: high | low
#         High = value expected above the normal-swing baseline mean.
#         Low  = value expected below the normal-swing baseline mean.
#         Direction is signed relative to baseline mean, not relative
#         to zero, so it works for rotation proxies (baseline
#         negative) and wrist angles (baseline near zero) uniformly.
#       known_weak: true                   (optional; default false)
#         Feature is known to be intrinsically weak for this fault —
#         e.g., motion-noisy, high baseline CV, or documented as a
#         weak-confidence indicator in phase2_notes. If the check
#         fails on this feature, the script reports it but does NOT
#         fail the run. Do NOT set known_weak just because a specific
#         demo underperformed — that hides real regressions.
#   notes: free text describing the swing or filming conditions


